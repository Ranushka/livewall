name: LiveWall
options:
  bundleIdPrefix: com.ranu
  deploymentTarget: { iOS: "17.0" }
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: MB7JU86DPQ   # Personal Team (free); replace with paid team for push
targets:
  LiveWall:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: ["LiveWall.storekit"]
      - Shared
    settings: { base: { PRODUCT_BUNDLE_IDENTIFIER: com.ranu.livewall } }
    entitlements:
      path: App/LiveWall.entitlements
      properties:
        aps-environment: development
        com.apple.security.application-groups: [group.com.ranu.livewall]
    info:
      path: App/Info.plist
      properties:
        UILaunchScreen: {}
        UIBackgroundModes: [remote-notification]
        CFBundleDisplayName: LiveWall
        NSPhotoLibraryAddUsageDescription: LiveWall saves your wallpaper to Photos as a Live Photo.
        LSSupportsOpeningDocumentsInPlace: false
        CFBundleDocumentTypes:
          - CFBundleTypeName: Video
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.movie]
    dependencies:
      - target: LiveWallWidget
      - target: LiveWallNSE
  LiveWallWidget:
    type: app-extension
    platform: iOS
    sources: [Widget, Shared]
    settings: { base: { PRODUCT_BUNDLE_IDENTIFIER: com.ranu.livewall.widget } }
    entitlements:
      path: Widget/Widget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.ranu.livewall]
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: LiveWall
        NSExtension: { NSExtensionPointIdentifier: com.apple.widgetkit-extension }
  LiveWallNSE:
    type: app-extension
    platform: iOS
    sources: [NSE, Shared]
    settings: { base: { PRODUCT_BUNDLE_IDENTIFIER: com.ranu.livewall.nse } }
    entitlements:
      path: NSE/NSE.entitlements
      properties:
        com.apple.security.application-groups: [group.com.ranu.livewall]
    info:
      path: NSE/Info.plist
      properties:
        CFBundleDisplayName: LiveWallNSE
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
schemes:
  LiveWall:
    build:
      targets: { LiveWall: all }
    run:
      storeKitConfiguration: App/LiveWall.storekit

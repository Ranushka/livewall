name: LiveWall
options:
  bundleIdPrefix: com.example
  deploymentTarget: { iOS: "17.0" }
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""   # set your Apple Team ID
targets:
  LiveWall:
    type: application
    platform: iOS
    sources: [App, Shared]
    settings: { base: { PRODUCT_BUNDLE_IDENTIFIER: com.example.livewall } }
    entitlements:
      path: App/LiveWall.entitlements
      properties:
        aps-environment: development
        com.apple.security.application-groups: [group.com.example.livewall]
    info:
      path: App/Info.plist
      properties:
        UILaunchScreen: {}
        UIBackgroundModes: [remote-notification]
        CFBundleDisplayName: LiveWall
    dependencies:
      - target: LiveWallWidget
      - target: LiveWallNSE
  LiveWallWidget:
    type: app-extension
    platform: iOS
    sources: [Widget, Shared]
    settings: { base: { PRODUCT_BUNDLE_IDENTIFIER: com.example.livewall.widget } }
    entitlements:
      path: Widget/Widget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.example.livewall]
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: LiveWall
        NSExtension: { NSExtensionPointIdentifier: com.apple.widgetkit-extension }
  LiveWallNSE:
    type: app-extension
    platform: iOS
    sources: [NSE, Shared]
    settings: { base: { PRODUCT_BUNDLE_IDENTIFIER: com.example.livewall.nse } }
    entitlements:
      path: NSE/NSE.entitlements
      properties:
        com.apple.security.application-groups: [group.com.example.livewall]
    info:
      path: NSE/Info.plist
      properties:
        CFBundleDisplayName: LiveWallNSE
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService

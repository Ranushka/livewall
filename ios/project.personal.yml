---
name: LiveWallPersonal
options:
  bundleIdPrefix: com.ranu
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.9'
    DEVELOPMENT_TEAM: MB7JU86DPQ
targets:
  LiveWall:
    type: application
    platform: iOS
    sources:
    - path: App
      excludes:
      - LiveWall.storekit
    - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ranu.livewall
    entitlements:
      path: App/LiveWall.entitlements
      properties: {}
    info:
      path: App/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: LiveWall
        NSPhotoLibraryAddUsageDescription: LiveWall saves your wallpaper to Photos
          as a Live Photo.
        LSSupportsOpeningDocumentsInPlace: false
        CFBundleDocumentTypes:
        - CFBundleTypeName: Video
          LSHandlerRank: Alternate
          LSItemContentTypes:
          - public.movie
schemes:
  LiveWall:
    build:
      targets:
        LiveWall: all
    run:
      storeKitConfiguration: App/LiveWall.storekit
